services:
  - type: web
    name: cedf-site-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://cedf.com.br,https://www.cedf.com.br
      - key: PORT
        value: 3002

  - type: web
    name: cedf-site
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cedf-site-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

services:
  - type: web
    name: cedf-site
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cedf-site-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Sites estáticos (runtime: static) não usam o campo "plan" — não têm instância
# própria, são sempre servidos de graça via CDN. Foi justamente declarar
# "plan: free" aqui que disparava o erro "no such plan free for service type
# web", mesmo em um site estático.
#
# O backend (cedf-site/backend) não entra nesse Blueprint: ele É um serviço web
# de verdade (roda Node), e o Render está recusando plan: free pra esse tipo de
# serviço dentro de Blueprints no momento, mesmo o plano Free existindo
# normalmente. Crie o backend manualmente pelo painel — New > Web Service —
# onde a opção Free ainda aparece certinho no dropdown. Veja backend/README.md.

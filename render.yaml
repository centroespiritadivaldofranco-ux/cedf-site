services:
  - type: web
    name: cedf-site
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cedf-site-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# O backend (cedf-site/backend) não entra nesse Blueprint: no momento o Render
# está recusando plan: free para serviços web dentro de Blueprints (erro
# "no such plan free for service type web"), mesmo o plano Free existindo
# normalmente. Crie o backend manualmente pelo painel — New > Web Service —
# onde a opção Free ainda aparece certinho no dropdown. Veja backend/README.md.
